name: Offline verification

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_MODE: demo
      ALLOW_LIVE_API: 'false'
      ALLOW_PROVIDER_FAILOVER: 'false'
      ROUTING_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Prepare the reviewed local map assets
        run: node scripts/prepare-assets.mjs
      - name: Check offline readiness
        run: node scripts/harness/runner.mjs doctor
      - name: Run deterministic checks, build and smoke
        run: node scripts/harness/runner.mjs verify
      - name: Collect evidence from this exact CI revision
        if: always()
        run: node scripts/harness/collect-ci-evidence.mjs
      - name: Retain only current sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: offline-verification
          path: ${{ runner.temp }}/spot-evidence/
          if-no-files-found: warn
          retention-days: 7
